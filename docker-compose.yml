x-api: &api
  build: ./app
  environment:
    DATABASE_URL: postgresql://accesorodo:${POSTGRES_PASSWORD:-demo}@db:5432/accesorodo
    ADMIN_TOKEN: ${ADMIN_TOKEN:-TFU-UT2-SECRET-KEY}
    TOKEN_SECRET: ${TOKEN_SECRET:-solo-demo-cambiar-antes-de-publicar}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 5s
    timeout: 4s
    retries: 12

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: accesorodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: accesorodo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesorodo -d accesorodo"]
      interval: 3s
      timeout: 3s
      retries: 20

  web_replica_1:
    <<: *api
  web_replica_2:
    <<: *api
  web_replica_3:
    <<: *api

  lb:
    image: nginx:1.28-alpine
    volumes:
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      web_replica_1:
        condition: service_healthy
      web_replica_2:
        condition: service_healthy
      web_replica_3:
        condition: service_healthy

volumes:
  postgres_data:
